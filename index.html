<!doctype html>
<html lang="__SITE_LANG__">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" sizes="64x64" href="/favicon.jpg" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch {
          // Storage may be disabled by browser privacy settings.
        }
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="author" content="__SITE_AUTHOR__" />
    <meta name="keywords" content="__SITE_KEYWORDS__" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="__SITE_SOCIAL_TITLE__" />
    <meta property="og:description" content="__SITE_SOCIAL_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_IMAGE__" />
    <link rel="canonical" href="__SITE_URL__" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_SOCIAL_TITLE__" />
    <meta name="twitter:description" content="__SITE_SOCIAL_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_IMAGE__" />
    
    <title>__SITE_TITLE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
